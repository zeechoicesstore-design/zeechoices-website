name: Sync ZeeChoices Etsy Products

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Fetch Etsy listings
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_NAME: ZeeChoiceStore
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          key = os.environ["ETSY_API_KEY"]
          secret = os.environ["ETSY_SHARED_SECRET"]
          shop_name = os.environ["ETSY_SHOP_NAME"]

          if not key or not secret:
              raise SystemExit("Etsy API secrets are missing.")

          headers = {
              "x-api-key": f"{key}:{secret}",
              "Accept": "application/json"
          }

          def get_json(url):
              request = urllib.request.Request(
                  url, headers=headers
              )
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  return json.load(response)

          query = urllib.parse.urlencode({
              "shop_name": shop_name,
              "limit": 100
          })

          shops = get_json(
              "https://openapi.etsy.com/v3/application/shops?"
              + query
          )

          matches = [
              shop for shop in shops.get("results", [])
              if shop.get("shop_name", "").casefold()
              == shop_name.casefold()
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "Could not identify exactly one Etsy shop. "
                  "Check ETSY_SHOP_NAME in the workflow."
              )

          shop_id = matches[0]["shop_id"]
          products = []
          offset = 0
          limit = 100

          while True:
              params = urllib.parse.urlencode({
                  "limit": limit,
                  "offset": offset,
                  "includes": "Images"
              })
              url = (
                  "https://openapi.etsy.com/v3/application/"
                  f"shops/{shop_id}/listings/active?{params}"
              )
              data = get_json(url)
              listings = data.get("results", [])

              for item in listings:
                  price = item.get("price", {})
                  if isinstance(price, dict):
                      divisor = price.get("divisor", 1) or 1
                      price_value = (
                          price.get("amount", 0) / divisor
                      )
                      currency = price.get("currency_code", "")
                  else:
                      price_value = price
                      currency = ""

                  images = item.get("images", item.get("Images", []))
                  image_url = ""
                  if images:
                      image_url = (
                          images[0].get("url_fullxfull")
                          or images[0].get("url_570xN")
                          or images[0].get("url_170x135")
                          or ""
                      )

                  products.append({
                      "listing_id": item.get("listing_id"),
                      "title": item.get("title", ""),
                      "url": item.get("url", ""),
                      "price": price_value,
                      "currency": currency,
                      "image": image_url
                  })

              if len(listings) < limit:
                  break
              offset += limit

          with open("products.json", "w", encoding="utf-8") as file:
              json.dump(
                  products, file,
                  ensure_ascii=False, indent=2
              )

          print(f"Fetched {len(products)} Etsy listings.")
          PY

      - name: Commit updated products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "No product changes to commit."
          else
            git commit -m "Update Etsy products"
            git push
          fi
